<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset & Test Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            background: #3d2f7c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #5a4794;
        }
        .success {
            background: #28a745;
            padding: 10px;
            border-radius: 5px;
            color: white;
            margin: 10px 0;
            display: none;
        }
        .info {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Authentication Reset & Test</h1>
    
    <div class="info">
        <h3>Step 1: Clear All Data</h3>
        <button onclick="clearAllData()">🗑️ DELETE ALL USERS</button>
        <div id="clearStatus"></div>
    </div>
    
    <div class="info">
        <h3>Step 2: Register Test User</h3>
        <button onclick="createTestUser()">➕ Create Test User</button>
        <div id="registerStatus"></div>
    </div>
    
    <div class="info">
        <h3>Step 3: Test Login</h3>
        <button onclick="testLogin()">🔑 Test Login</button>
        <div id="loginStatus"></div>
    </div>
    
    <div class="info">
        <h3>Step 4: Go to Pages</h3>
        <button onclick="location.href='register.html'">📝 Register Page</button>
        <button onclick="location.href='login.html'">🔐 Login Page</button>
        <button onclick="location.href='index.html'">🏠 Home Page</button>
    </div>
    
    <h2>Current Storage Status:</h2>
    <button onclick="checkStorage()">🔍 Refresh Status</button>
    <pre id="storageStatus">Click "Refresh Status" to view</pre>
    
    <script>
        function clearAllData() {
            localStorage.clear();
            document.getElementById('clearStatus').innerHTML = '<div class="success" style="display:block">✅ All data cleared successfully!</div>';
            checkStorage();
        }
        
        function createTestUser() {
            // Clear first
            localStorage.clear();
            
            const testUser = {
                fullName: 'Test User',
                phoneNumber: '1234567890',
                qualification: 'Masters',
                email: 'test@example.com',
                password: 'test1234',
                registeredDate: new Date().toISOString(),
                progress: 0,
                enrolledCourses: 0,
                completedCourses: 0,
                inProgressCourses: 0
            };
            
            const users = [testUser];
            localStorage.setItem('users', JSON.stringify(users));
            
            document.getElementById('registerStatus').innerHTML = 
                '<div class="success" style="display:block">✅ Test user created!<br>' +
                '<strong>Full Name:</strong> Test User<br>' +
                '<strong>Email:</strong> test@example.com<br>' +
                '<strong>Password:</strong> test1234</div>';
            
            checkStorage();
        }
        
        function testLogin() {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.length === 0) {
                document.getElementById('loginStatus').innerHTML = 
                    '<div style="background:#dc3545;color:white;padding:10px;border-radius:5px;display:block">❌ No users found! Create a test user first.</div>';
                return;
            }
            
            const testUser = users.find(u => 
                u.fullName.toLowerCase() === 'test user' && 
                u.password === 'test1234'
            );
            
            if (testUser) {
                localStorage.setItem('currentUser', JSON.stringify(testUser));
                document.getElementById('loginStatus').innerHTML = 
                    '<div class="success" style="display:block">✅ Login successful!<br>' +
                    'User: ' + testUser.fullName + '<br>' +
                    '<button onclick="location.href=\'user-dashboard.html\'">Go to Dashboard</button></div>';
            } else {
                document.getElementById('loginStatus').innerHTML = 
                    '<div style="background:#dc3545;color:white;padding:10px;border-radius:5px;display:block">❌ Login failed! User not found.</div>';
            }
        }
        
        function checkStorage() {
            const users = localStorage.getItem('users');
            const currentUser = localStorage.getItem('currentUser');
            const allKeys = Object.keys(localStorage);
            
            let status = '📊 LocalStorage Status:\n\n';
            status += 'Total Keys: ' + allKeys.length + '\n';
            status += 'Keys: ' + JSON.stringify(allKeys) + '\n\n';
            
            if (users) {
                const parsedUsers = JSON.parse(users);
                status += '👥 Users (' + parsedUsers.length + '):\n';
                status += JSON.stringify(parsedUsers, null, 2);
            } else {
                status += '👥 Users: None\n';
            }
            
            status += '\n\n';
            
            if (currentUser) {
                status += '🔐 Current User:\n';
                status += JSON.stringify(JSON.parse(currentUser), null, 2);
            } else {
                status += '🔐 Current User: None (not logged in)';
            }
            
            document.getElementById('storageStatus').textContent = status;
        }
        
        // Auto-check on load
        checkStorage();
    </script>
</body>
</html>

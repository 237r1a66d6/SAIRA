<body>
    <div class="container">
        <h1>🧪 Delete User API Tester</h1>
        <div id="timestamp" class="info status">
            Loading... Timestamp: <span id="loadTime"></span>
        </div>
        
        <div id="versionCheck" class="warning status">
            Checking API version...
        </div>
        
        <div class="test-section">
            <h3>Test Delete User Function</h3>
            <p>Enter a user ID to test the delete API:</p>
            <input type="number" id="userIdInput" placeholder="Enter User ID (e.g., 7)" min="1">
            <button onclick="testDelete()" class="delete-btn">🗑️ Test Delete</button>
            <button onclick="loadUsers()">📋 Load All Users</button>
            <button onclick="clearConsole()">🧹 Clear Console</button>
        </div>
        
        <div class="test-section">
            <h3>Current Users</h3>
            <div id="userList" class="user-list">
                <p style="color: #666;">Click "Load All Users" to see users from database</p>
            </div>
        </div>
        
        <div class="test-section">
            <h3>📊 Console Output</h3>
            <div id="console"></div>
        </div>
    </div>

    <!-- Load API with cache buster -->
    <script src="js/api-config.js?nocache=<?php echo time(); ?>"></script>
    <script>
        // Display load timestamp
        document.getElementById('loadTime').textContent = new Date().toLocaleString();
        
        // Custom console logger
        function log(message, type = 'info') {
            const consoleDiv = document.getElementById('console');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            consoleDiv.appendChild(logEntry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            
            // Also log to browser console
            console.log(message);
        }
        
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            log('Console cleared', 'info');
        }
        
        // Check API version
        function checkVersion() {
            const versionDiv = document.getElementById('versionCheck');
            
            if (typeof api === 'undefined') {
                versionDiv.className = 'error status';
                versionDiv.innerHTML = '❌ ERROR: API object not loaded!';
                log('API object not found!', 'error');
                return false;
            }
            
            if (typeof api.deleteUser !== 'function') {
                versionDiv.className = 'error status';
                versionDiv.innerHTML = '❌ ERROR: deleteUser function not found!';
                log('deleteUser function not found!', 'error');
                return false;
            }
            
            // Check if it's the new version
            const fnString = api.deleteUser.toString();
            if (fnString.includes('API deleteUser called with userId')) {
                versionDiv.className = 'success status';
                versionDiv.innerHTML = '✅ SUCCESS: Using NEW deleteUser function (v2.0.1) - Sends ID in body';
                log('✅ Confirmed: Using NEW deleteUser function', 'success');
                log('📦 Function sends ID in request body, NOT in URL', 'success');
                return true;
            } else {
                versionDiv.className = 'error status';
                versionDiv.innerHTML = '⚠️ WARNING: Old deleteUser function detected! Press Ctrl+Shift+R to hard refresh!';
                log('⚠️ Old deleteUser function detected!', 'warn');
                log('🔄 Solution: Press Ctrl+Shift+R to force refresh', 'warn');
                return false;
            }
        }
        
        // Load users from database
        async function loadUsers() {
            log('📡 Loading users from database...', 'info');
            const userListDiv = document.getElementById('userList');
            userListDiv.innerHTML = '<p style="color: #666;">Loading...</p>';
            
            try {
                const response = await api.getAllUsers();
                log(`✅ Loaded ${response.data.users.length} users`, 'success');
                
                if (response.data.users.length === 0) {
                    userListDiv.innerHTML = '<p style="color: #666;">No users found in database</p>';
                    return;
                }
                
                userListDiv.innerHTML = '';
                response.data.users.forEach(user => {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user-item';
                    userDiv.innerHTML = `
                        <div class="user-info">
                            <div class="user-name">${user.username || 'N/A'} (ID: ${user.id})</div>
                            <div class="user-email">${user.email || 'N/A'}</div>
                        </div>
                        <button onclick="testDelete(${user.id})" class="delete-btn">🗑️ Delete</button>
                    `;
                    userListDiv.appendChild(userDiv);
                });
                
            } catch (error) {
                log(`❌ Error loading users: ${error.message}`, 'error');
                userListDiv.innerHTML = `<p style="color: #dc3545;">Error: ${error.message}</p>`;
            }
        }
        
        // Test delete function
        async function testDelete(userId = null) {
            if (!userId) {
                userId = document.getElementById('userIdInput').value;
            }
            
            if (!userId || userId < 1) {
                log('⚠️ Please enter a valid user ID', 'warn');
                alert('Please enter a valid user ID');
                return;
            }
            
            const confirmed = confirm(`Are you sure you want to delete user ID ${userId}?\n\n⚠️ This will permanently delete the user from the database!`);
            if (!confirmed) {
                log('Delete cancelled by user', 'info');
                return;
            }
            
            log(`🗑️ Testing delete for user ID: ${userId}`, 'info');
            log(`📍 Expected URL: /api/admin/users.php (NOT /api/admin/users.php/${userId})`, 'info');
            log(`📦 Expected Body: {"id": ${userId}}`, 'info');
            
            try {
                // Call the delete API
                const response = await api.deleteUser(userId);
                
                if (response && response.success) {
                    log(`✅ SUCCESS: User ${userId} deleted from database!`, 'success');
                    log(`📄 Response: ${JSON.stringify(response)}`, 'success');
                    alert(`✅ User deleted successfully!\n\nUser ID ${userId} has been removed from the database.`);
                    
                    // Reload user list
                    loadUsers();
                } else {
                    log(`❌ Delete failed: ${response?.message || 'Unknown error'}`, 'error');
                    alert(`❌ Delete failed: ${response?.message || 'Unknown error'}`);
                }
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                log(`🔍 Full error: ${error.stack}`, 'error');
                
                // Check if error is about URL format
                if (error.message.includes('User ID is required') || error.message.includes('400')) {
                    log('⚠️ This error suggests the old API code is still running!', 'warn');
                    log('🔄 Solution: Press Ctrl+Shift+R to force reload, or use a different browser', 'warn');
                }
                
                alert(`❌ Delete failed!\n\n${error.message}\n\nCheck console for details.`);
            }
        }
        
        // Run version check on load
        window.addEventListener('load', () => {
            log('🚀 Page loaded successfully', 'info');
            log(`⏰ Timestamp: ${new Date().toISOString()}`, 'info');
            
            setTimeout(() => {
                const isNewVersion = checkVersion();
                if (isNewVersion) {
                    log('✅ Ready to test delete functionality!', 'success');
                    log('💡 Tip: Load users first, then click delete on any user', 'info');
                } else {
                    log('⚠️ Please clear browser cache and reload!', 'warn');
                }
            }, 500);
        });
        
        // Log API config info
        setTimeout(() => {
            if (typeof API_CONFIG !== 'undefined') {
                log(`📍 API Base URL: ${API_CONFIG.BASE_URL}`, 'info');
                log(`📍 Users Endpoint: ${API_CONFIG.ENDPOINTS.ADMIN_USERS}`, 'info');
            }
        }, 1000);
    </script>
</body>

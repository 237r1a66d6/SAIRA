<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background: #3d2f7c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5a4794;
        }
    </style>
</head>
<body>
    <h1>LocalStorage Data Checker</h1>
    
    <button onclick="showUsers()">Show All Users</button>
    <button onclick="clearUsers()">Clear All Users</button>
    <button onclick="clearEverything()">Clear EVERYTHING (Full Reset)</button>
    <button onclick="location.href='register.html'">Go to Register</button>
    
    <h2>Stored Users:</h2>
    <pre id="usersData">Click "Show All Users" button</pre>
    
    <h2>All LocalStorage Keys:</h2>
    <pre id="allKeys"></pre>
    
    <script>
        function showUsers() {
            const users = localStorage.getItem('users');
            const usersData = document.getElementById('usersData');
            
            if (users) {
                const parsedUsers = JSON.parse(users);
                usersData.textContent = JSON.stringify(parsedUsers, null, 2);
            } else {
                usersData.textContent = 'No users found in localStorage';
            }
            
            // Show all keys
            const allKeys = document.getElementById('allKeys');
            const keys = Object.keys(localStorage);
            allKeys.textContent = 'Total keys: ' + keys.length + '\n' + JSON.stringify(keys, null, 2);
        }
        
        function clearUsers() {
            if (confirm('Are you sure you want to clear all users?')) {
                localStorage.removeItem('users');
                localStorage.removeItem('currentUser');
                alert('Users cleared!');
                showUsers();
            }
        }
        
        function clearEverything() {
            if (confirm('This will clear ALL localStorage data. Continue?')) {
                localStorage.clear();
                alert('All localStorage cleared! You can now register fresh.');
                showUsers();
            }
        }
        
        // Auto-show on load
        showUsers();
    </script>
</body>
</html>

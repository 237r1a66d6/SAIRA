<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SAIRA ACAD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/OnlyLogo(noBG).png" alt="SAIRA ACAD Logo" class="logo-image">
                    <div class="logo-text">
                        <h1>SAIRA <span class="highlight">ACAD</span></h1>
                        <p class="tagline">Guiding Academic Excellence</p>
                    </div>
                </a>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-secondary">Home</a>
                <a href="login.html" class="btn btn-primary">Login</a>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-box">
                <h2>Create Your Account</h2>
                <p class="auth-subtitle">Join SAIRA ACAD and start your journey to academic excellence</p>
                
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="fullName">Username *</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="Enter your phone number" pattern="[0-9]{10}">
                        <small>Please enter a 10-digit phone number</small>
                    </div>

                    <div class="form-group">
                        <label for="qualification">Qualification *</label>
                        <select id="qualification" name="qualification" required>
                            <option value="">Select your qualification</option>
                            <option value="B.Ed">B.Ed (Bachelor of Education)</option>
                            <option value="M.Ed">M.Ed (Master of Education)</option>
                            <option value="B.A">B.A (Bachelor of Arts)</option>
                            <option value="M.A">M.A (Master of Arts)</option>
                            <option value="B.Sc">B.Sc (Bachelor of Science)</option>
                            <option value="M.Sc">M.Sc (Master of Science)</option>
                            <option value="PhD">PhD (Doctor of Philosophy)</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required placeholder="Create a password" minlength="8">
                        <small>Password must be at least 8 characters long</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">Register Now</button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                    <p class="admin-link"><a href="admin-login.html">Admin Login</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>

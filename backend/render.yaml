services:
  - type: web
    name: saira-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://sairaacad.com,https://www.sairaacad.com
      - key: PORT
        value: 5000

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SAIRA ACAD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/OnlyLogo(noBG).png" alt="SAIRA ACAD Logo" class="logo-image">
                    <div class="logo-text">
                        <h1>SAIRA <span class="highlight">ACAD</span></h1>
                        <p class="tagline">Guiding Academic Excellence</p>
                    </div>
                </a>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-secondary">Home</a>
                <a href="register.html" class="btn btn-secondary">Register</a>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-box">
                <h2>Login</h2>
                <p class="auth-subtitle">Login to access your dashboard</p>
                
                <form id="loginForm" class="auth-form" onsubmit="return false;">
                    <div class="form-group">
                        <label for="fullName">Username *</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Enter your username" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="off">
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                    <p class="admin-link"><a href="admin-login.html">Admin Login</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/auth.js"></script>
    <script src="js/api-config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Clear & Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background: #dc3545;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            margin: 10px;
        }
        button:hover {
            background: #c82333;
        }
        .success {
            background: #28a745;
        }
        .success:hover {
            background: #218838;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>🔧 Complete Reset</h1>
    <p>This will completely clear all data and open a fresh registration page.</p>
    
    <h3>Current Storage:</h3>
    <pre id="status"></pre>
    
    <button onclick="forceClearAndRegister()">🗑️ FORCE CLEAR & REGISTER</button>
    
    <script>
        function showStatus() {
            const status = document.getElementById('status');
            const users = localStorage.getItem('users');
            const admins = localStorage.getItem('admins');
            const currentUser = localStorage.getItem('currentUser');
            
            let output = 'Total localStorage keys: ' + localStorage.length + '\n\n';
            output += 'users: ' + (users || 'null') + '\n\n';
            output += 'admins: ' + (admins || 'null') + '\n\n';
            output += 'currentUser: ' + (currentUser || 'null');
            
            status.textContent = output;
        }
        
        function forceClearAndRegister() {
            // Multiple methods to ensure clearing
            localStorage.clear();
            localStorage.removeItem('users');
            localStorage.removeItem('admins');
            localStorage.removeItem('currentUser');
            
            // Set users to empty array explicitly
            localStorage.setItem('users', '[]');
            
            alert('Storage cleared! Opening registration page...\n\nAfter registration, DO NOT click browser back button. Use the navigation links instead.');
            
            // Small delay then open registration
            setTimeout(function() {
                window.location.href = 'register.html';
            }, 500);
        }
        
        // Show status on load
        showStatus();
        
        // Refresh status every second
        setInterval(showStatus, 1000);
    </script>
</body>
</html>
